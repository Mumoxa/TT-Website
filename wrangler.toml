# Talent Tree — Cloudflare Pages project with Pages Functions.
#
# Local development / verification (no Cloudflare account needed):
#   npm install
#   npx wrangler d1 migrations apply tt-offers --local
#   npm run build
#   npx wrangler pages dev dist --port 8788
#
# Production (one-time, done by a human with Cloudflare access):
#   1. npx wrangler d1 create tt-offers        -> paste the real database_id below
#   2. npx wrangler r2 bucket create tt-offers-private
#   3. npx wrangler d1 migrations apply tt-offers --remote
#   4. On the Cloudflare Pages project add bindings:
#        D1   DB          -> tt-offers
#        R2   PDF_BUCKET  -> tt-offers-private
#      and the secret variable ADMIN_KEY (see README; never commit the value).
#   5. Deploy via git push to main (existing Pages flow) or `npx wrangler pages deploy dist`.

name = "tt-website"
compatibility_date = "2026-09-08"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"                            # env.DB — offers, acceptances, audit events
database_name = "tt-offers"
database_id = "4eafef72-b7cc-4e83-8681-fac4893711fd"

[[r2_buckets]]
binding = "PDF_BUCKET"                    # env.PDF_BUCKET — private storage for offer PDFs
bucket_name = "tt-offers-private"

# Dedicated assessment storage; production offers bindings above are unchanged.
[[d1_databases]]
binding = "ASSESSMENT_DB"
database_name = "tt-assessments"
database_id = "b8e74387-6b66-4dd1-beab-78a1aac12231"
migrations_dir = "migrations/assessments"

# Never expose the real offers database or confidential PDFs to preview code.
# Applying this shared preview configuration requires checking existing previews.
[env.preview]
r2_buckets = []

[[env.preview.d1_databases]]
binding = "ASSESSMENT_DB"
database_name = "tt-assessments-preview"
database_id = "de7ee76a-f8ae-4a39-bae4-d1e135bbec95"
migrations_dir = "migrations/assessments"
