name: CV parser access audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret availability
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          CV_PARSE_TOKEN: ${{ secrets.CV_PARSE_TOKEN }}
          CV_PARSE_UPSTREAM: ${{ secrets.CV_PARSE_UPSTREAM }}
        run: |
          test -n "$CF_TOKEN" && echo "CLOUDFLARE_API_TOKEN=present" || echo "CLOUDFLARE_API_TOKEN=missing"
          test -n "$CF_ACCOUNT" && echo "CLOUDFLARE_ACCOUNT_ID=present" || echo "CLOUDFLARE_ACCOUNT_ID=missing"
          test -n "$ORACLE_KEY" && echo "ORACLE_SSH_PRIVATE_KEY=present" || echo "ORACLE_SSH_PRIVATE_KEY=missing"
          test -n "$CV_PARSE_TOKEN" && echo "CV_PARSE_TOKEN=present" || echo "CV_PARSE_TOKEN=missing"
          test -n "$CV_PARSE_UPSTREAM" && echo "CV_PARSE_UPSTREAM=present" || echo "CV_PARSE_UPSTREAM=missing"

      - name: Check Cloudflare project access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Cloudflare project check skipped: credentials missing"
            exit 0
          fi
          npx wrangler pages project list
