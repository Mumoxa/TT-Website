name: Corrective website verification

on:
  push:
    branches:
      - arena/01a01c0a-tt-website
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: npm test

      - name: Build production bundle
        run: npm run build
